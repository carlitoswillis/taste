name: Publish site

# Builds dist/ and pushes it to the public mirror repo (carlitoswillis/taste-site),
# which serves GitHub Pages. The source repo stays private; only the rendered
# site is public. Runs on data/template pushes, manual dispatch, and is called
# by sync.yml after the daily data refresh.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "templates/**"
      - "config.json"
      - "scripts/build.mjs"

concurrency:
  group: publish
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.mjs
      - name: Check out site repo
        uses: actions/checkout@v4
        with:
          repository: carlitoswillis/taste-site
          ssh-key: ${{ secrets.TASTE_SITE_DEPLOY_KEY }}
          path: site
      - name: Copy build into site repo
        run: |
          rsync -a --delete --exclude .git --exclude README.md dist/ site/
          touch site/.nojekyll
      - name: Commit and push if changed
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "publish site"
            git push
          fi

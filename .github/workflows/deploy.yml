name: Publish site

# Publishes the built site via GitHub Pages' artifact flow — only dist/ is
# ever served; the repo itself stays private (Pages build_type=workflow).
# Site: https://carlitoswillis.github.io/taste/
# Runs on data/template pushes, manual dispatch, and is called by sync.yml
# after the daily data refresh.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "templates/**"
      - "config.json"
      - "scripts/build.mjs"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

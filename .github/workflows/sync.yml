name: Sync Letterboxd + TMDB

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch:

# contents for the data commit; pages/id-token for the publish call below
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Goes red and annotates the run when the feed returns nothing, but does
      # not stop the sync: enrichment, themes and suggestions don't depend on it.
      - name: Fetch Letterboxd RSS
        continue-on-error: true
        run: node scripts/fetch-letterboxd.mjs

      - name: Enrich from TMDB (skipped if no key configured)
        if: ${{ env.TMDB_API_KEY != '' }}
        run: node scripts/enrich-tmdb.mjs

      - name: Enrich TV from TMDB
        if: ${{ env.TMDB_API_KEY != '' }}
        run: node scripts/enrich-tv.mjs

      - name: Enrich books from Open Library (tolerates outages)
        continue-on-error: true
        run: node scripts/enrich-books.mjs

      - name: Recompute themes
        run: node scripts/themes.mjs

      - name: Bridge adaptations via Wikidata (tolerates outages)
        continue-on-error: true
        run: node scripts/bridge-adaptations.mjs

      - name: Recompute profile stats
        run: node scripts/profile-stats.mjs

      - name: Refresh suggestions
        if: ${{ env.TMDB_API_KEY != '' }}
        run: node scripts/suggest.mjs

      - name: Refresh TV suggestions
        if: ${{ env.TMDB_API_KEY != '' }}
        run: node scripts/suggest-tv.mjs

      - name: Refresh book suggestions (tolerates outages)
        continue-on-error: true
        run: node scripts/suggest-books.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/letterboxd.json data/ratings.json data/watched.json data/enrichment.json data/suggestions.json data/stats.json data/themes.json \
            data/tv-enrichment.json data/tv-suggestions.json data/book-enrichment.json data/book-suggestions.json data/adaptations.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: sync letterboxd/tmdb data"
            git push
          fi

  # Pushes made with GITHUB_TOKEN don't fire other workflows' push triggers,
  # so the daily sync republishes the site explicitly.
  publish:
    needs: sync
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
